name: flutter_daemon
description: "Run processes in the background"
version: 0.0.1
homepage: https://github.com/MrCyjaneK/flutter_daemon

environment:
  sdk: ^3.5.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: net.mrcyjanek.flutter_daemon
        pluginClass: FlutterDaemonPlugin
      elinux:
        pluginClass: FlutterDaemonPlugin
      ios:
        pluginClass: FlutterDaemonPlugin
